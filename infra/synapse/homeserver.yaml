# Synapse config for the local demo homeserver klinikum.example.
# Secrets (registration shared secret, signing key) are generated at first start
# by the synapse-init service into the synapse-data volume. Nothing secret here.
server_name: "klinikum.example"
public_baseurl: "http://localhost:8008/"
pid_file: /data/homeserver.pid
report_stats: false

# The listener binds 0.0.0.0 INSIDE the container: Docker's port publishing reaches it on the container's
# eth0, so 127.0.0.1 here would make it unreachable. Exposure is limited by the compose port mapping
# (127.0.0.1:8008 on the host); no other container talks to Synapse.
listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses: ["0.0.0.0"]
    resources:
      - names: [client]
        compress: false

database:
  name: sqlite3
  args:
    database: /data/homeserver.db

log_config: /config/log.config
media_store_path: /data/media_store
signing_key_path: /data/signing.key
registration_shared_secret_path: /data/registration_shared_secret

# v11: classic room ids "!x:klinikum.example" (v12 drops the server part; matrix-nio and the bot expect it)
default_room_version: "11"

enable_registration: false
# no federation in the demo
trusted_key_servers: []
suppress_key_server_warning: true
federation_domain_whitelist: []

# rc_login: Synapse defaults for failed_attempts (brute-force guard: 0.17/s, burst 3 per account).
# address/account (successful logins) are raised from 0.003/s burst 5: behind Docker's port forward every
# client shares ONE source address, so the default would 429 Element after a single `make demo-reset`
# (setup + smoke already use 5 logins) and lock the demo out for ~5 min per extra login.
rc_login:
  address: {per_second: 0.1, burst_count: 30}
  account: {per_second: 0.1, burst_count: 30}
# Raised because the bot posts one message per request/outcome and the live test runs (88-document
# jury corpus) send far more than the default 0.2/s burst 10. Only two local users exist; no federation.
rc_message:
  per_second: 50
  burst_count: 500
# rc_registration, rc_joins, rc_invites: Synapse defaults.

# New rooms are NOT end-to-end encrypted by default (the bot is a plain matrix-nio client).
encryption_enabled_by_default_for_room_type: "off"

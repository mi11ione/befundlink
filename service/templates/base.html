<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>{% block title %}{{ clinic }}{% endblock %}</title>
{% block head %}{% endblock %}
<style>
:root{--ink:#000;--grey:#595959;--rule:#000;--hair:#d6d6d6;--paper:#fff;--signal:#e30613;
--sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}
a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
b,strong{font-weight:700}
.top{padding:22px 0 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.mark{font-weight:700;font-size:17px;letter-spacing:-.01em}
.org{font-size:15px;color:var(--grey);text-align:right}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:13px;color:var(--grey)}
.steps li{border-top:1px solid var(--hair);padding-top:8px}
.steps li.on{border-top:3px solid var(--ink);padding-top:6px;color:var(--ink);font-weight:700}
.steps li.done{border-top-color:var(--ink);color:var(--ink)}
.steps span{margin-right:6px}
main{padding:56px 0 40px}
h1{font-size:34px;line-height:1.08;font-weight:700;letter-spacing:-.022em;margin:0 0 20px}
h2{font-size:20px;line-height:1.25;font-weight:700;letter-spacing:-.01em;margin:0 0 12px}
p{margin:0 0 16px;max-width:34em}
.lead{font-size:21px;line-height:1.35;letter-spacing:-.005em}
.statement{font-size:24px;line-height:1.3;font-weight:500;letter-spacing:-.012em}
.pre{font-size:17px;color:var(--grey);margin-bottom:6px}
.muted{color:var(--grey)}
.small{font-size:15px}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:0}
.ref{letter-spacing:.04em;white-space:nowrap}
.gap{margin-top:40px}
.stop{border-top:4px solid var(--signal);padding-top:18px;margin:0 0 40px}
.stop h1,.stop h2{color:var(--signal)}
.stop h2{margin-bottom:8px}
.stop p{margin:0 0 6px}
.stop>p:only-child{color:var(--signal);font-weight:500}
.nw{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.note{border-top:4px solid var(--ink);padding-top:14px;margin:0 0 28px;font-weight:500;max-width:34em}
form{margin:0}
label{display:block;font-size:15px;font-weight:700;margin:0 0 8px}
.field{margin:0 0 22px}
.hint{display:block;font-size:15px;color:var(--grey);margin:-2px 0 8px;font-weight:400}
input:not([type]),input[type=text],input[type=password],input[type=date],input[type=tel]{display:block;width:100%;height:52px;
padding:0 14px;font:400 17px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--ink);border-radius:0;
-webkit-appearance:none;appearance:none;margin:0}
input:focus-visible{outline:3px solid var(--ink);outline-offset:0}
input::placeholder{color:#767676}
.btn{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:56px;padding:0 20px;
font:700 17px/1.2 var(--sans);letter-spacing:-.005em;text-align:left;text-decoration:none;cursor:pointer;
color:var(--paper);background:var(--ink);border:1px solid var(--ink);border-radius:0;-webkit-appearance:none;appearance:none}
.btn::after{content:"\2192";font-weight:400}
.btn:hover{background:#262626}
.btn.alt{color:var(--ink);background:var(--paper)}
.btn.alt:hover{background:#f2f2f2}
.btn.alt::after{content:none}
.below{margin-top:14px}
.drop{position:relative;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--ink);padding:24px 20px;margin:0 0 16px;min-height:136px}
.drop:has(input:valid){border-width:2px;padding:23px 19px}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.drop:focus-within{outline:3px solid var(--ink);outline-offset:3px}
.drop.over{background:#f2f2f2}
.drop-t{display:block;font-size:21px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.drop-h{display:block;font-size:15px;color:var(--grey)}
.drop-chosen{display:none}
.drop input:valid~.drop-empty{display:none}
.drop input:valid~.drop-chosen{display:block}
#file-name{display:block;font-family:var(--mono);font-size:16px;font-weight:600;overflow-wrap:anywhere;margin-bottom:6px}
#file-name::before{content:"\2713\00a0\00a0";font-family:var(--sans);font-weight:700;font-size:21px}
#file-name:empty::before{content:"\2713\00a0\00a0 Datei ausgewählt"}
.sep{border:0;border-top:1px solid var(--hair);margin:48px 0 32px}
.rows{margin:0 0 24px;padding:0;border-top:1px solid var(--rule)}
.rows div{display:grid;grid-template-columns:calc((100% - 16px)/3 + 8px) 1fr;padding:12px 0;border-bottom:1px solid var(--hair)}
.rows dt{color:var(--grey);font-size:15px;padding:1px 12px 0 0}
.sha{font-family:var(--mono);font-size:.92em}
.sha span{display:inline-block;margin-right:.55em}
details{margin-top:8px}
summary{display:flex;align-items:center;min-height:44px;cursor:pointer;color:var(--grey);list-style:none;
text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;max-width:max-content}
summary::-webkit-details-marker{display:none}
details[open] summary{color:var(--ink);text-decoration:none;font-weight:700}
details form{padding-top:12px}
.rows dd{margin:0;min-width:0;overflow-wrap:anywhere}
.foot{border-top:1px solid var(--hair);padding:16px 0 40px;font-size:15px;color:var(--grey)}
.foot p{margin:0 0 4px}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.list li{border-bottom:1px solid var(--hair)}
.list a{display:flex;justify-content:space-between;align-items:center;min-height:56px;text-decoration:none;font-weight:700}
.list a::after{content:"\2192";font-weight:400}
.sms{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.sms li{border-bottom:1px solid var(--hair);padding:18px 0 20px}
.sms p{margin:0}
.sms .when{font-size:15px;color:var(--grey);margin-bottom:8px}
.sms .who{font-weight:700}
.sms .go{display:inline-flex;align-items:center;min-height:44px}
@media (min-width:720px){
main{padding:88px 0 56px}
h1{font-size:48px;margin-bottom:24px}
.statement{font-size:28px}
.btn{width:auto;min-width:320px;display:inline-flex}
.btn.wide{width:100%;display:flex}
}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
{% block header %}{% if wordmark %}<span class="mark">Befundlink</span><span class="org">{{ clinic }}</span>{% else %}<span class="mark">{{ clinic }}</span>{% endif %}{% endblock %}
</header>
<main>
{% if step %}<ol class="steps" aria-label="Schritte">
<li class="{{ 'on' if step == 1 else 'done' }}"{% if step == 1 %} aria-current="step"{% endif %}><span>01</span>Identität</li>
<li class="{{ 'on' if step == 2 else ('done' if step > 2 else '') }}"{% if step == 2 %} aria-current="step"{% endif %}><span>02</span>Dokument</li>
<li class="{{ 'on' if step == 3 else '' }}"{% if step == 3 %} aria-current="step"{% endif %}><span>03</span>Fertig</li>
</ol>
<div class="gap"></div>{% endif %}
{% block body %}{% endblock %}
</main>
{% block foot %}{% endblock %}
</div>
</body>
</html>
